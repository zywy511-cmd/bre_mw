name: Build iOS IPA Only

# 只构建 iOS 免签 ipa，不触发 Android / Windows / macOS / Linux。
# 仅支持手动触发，不监听 push，避免推代码时拉起其它平台。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-only
  cancel-in-progress: false

env:
  MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ secrets.BREEZE_PLUGIN_GITHUB_TOKEN != '' &&
    secrets.BREEZE_PLUGIN_GITHUB_TOKEN || github.token }}

jobs:
  build-ios:
    # macos-14 已于 2026-11-02 退役，用更轻的 macos-15 arm64 池子
    runs-on: macos-15
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 编译 iOS (无签)
        env:
          # 无 Development Team 的 runner 上强制免签：Flutter 会把这两个配置透传给 xcodebuild
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: NO
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: NO
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export IPHONEOS_DEPLOYMENT_TARGET="15.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET -isysroot $SDKROOT"
          export CXXFLAGS_aarch64_apple_ios="$CFLAGS_aarch64_apple_ios"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET"
          export RUSTFLAGS="$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"
          rm -f rust/.cargo/config.toml
          rustup toolchain list
          fvm flutter precache --ios
          fvm flutter pub get
          # 动态修改 pbxcproj，关闭整个项目的强签名要求：
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBX"
          # 关掉自动签名：pbxproj 里是 CODE_SIGN_STYLE = Automatic，没有 Development Team 时
          # xcodebuild 会直接报 "requires a development team / provisioning profile"，
          # 改成 Manual 并去掉 ProvisioningStyle，配合上面的 CODE_SIGNING_ALLOWED=NO 出免签包。
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' '/ProvisioningStyle = Automatic;/d' "$PBX"
          fvm flutter build ios --release --no-codesign --split-debug-info=build/symbols --verbose

      - name: 封装 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Breeze-iOS.ipa" Payload

      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: Breeze-iOS.ipa
